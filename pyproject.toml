[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-wnba-stats"
version = "0.1.0"
description = "WNBA stats exploration via sportsdataverse-py."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Steven Burns" }]
dependencies = [
    "sportsdataverse>=0.0.40",
    "pandas>=2.2",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
wnba-stats = "claude_wnba_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
